name: Daily Articles

on:
  schedule:
    # 22:30 UTC = 07:30 JST
    - cron: "30 22 * * *"
  workflow_dispatch:
    inputs:
      target_date:
        description: "投稿対象日 (YYYY-MM-DD, 空欄なら本日 JST)"
        required: false
        default: ""
      skip_post:
        description: "Note 投稿をスキップ (true/false)"
        required: false
        default: "false"

concurrency:
  group: daily-articles
  cancel-in-progress: false

jobs:
  generate-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Tokyo
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      NOTE_SESSION_COOKIE: ${{ secrets.NOTE_SESSION_COOKIE }}
      NOTE_EMAIL: ${{ secrets.NOTE_EMAIL }}
      NOTE_PASSWORD: ${{ secrets.NOTE_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set target date
        id: date
        run: |
          if [ -n "${{ inputs.target_date }}" ]; then
            echo "value=${{ inputs.target_date }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          fi
          echo "投稿対象日: ${{ steps.date.outputs.value }}"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Build dataset (R2 から取得)
        run: uv run python scripts/build_dataset.py

      - name: Generate articles (17 店舗)
        run: uv run python scripts/generate_articles_all.py --date ${{ steps.date.outputs.value }}

      - name: Upload articles to R2
        run: |
          uv run python -c "
          from pathlib import Path
          from juggler_predictor.storage.article import upload_article_from_path
          date = '${{ steps.date.outputs.value }}'
          reports = Path('reports')
          count = 0
          for md in reports.glob(f'*_{date}.md'):
              shop_id = md.stem.replace(f'_{date}', '')
              upload_article_from_path(shop_id, date, md)
              print(f'[UPLOAD] {shop_id} -> articles/{shop_id}/{date}.md')
              count += 1
          print(f'[OK] uploaded {count} articles')
          "

      - name: Post to Note
        if: ${{ inputs.skip_post != 'true' }}
        run: uv run python scripts/post_articles_batch.py --date ${{ steps.date.outputs.value }} --price 300 --sleep 5

      - name: Archive articles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-articles-${{ steps.date.outputs.value }}
          path: reports/*_${{ steps.date.outputs.value }}.md
          retention-days: 14
          if-no-files-found: ignore
